# To enable access control, the role used by sidecar to talk to Cassandra must be granted following permissions
# - GRANT DESCRIBE ON ALL ROLES to <insert_sidecar_role>          - Allows sidecar to list roles that belong to a user
# - GRANT SELECT ON KEYSPACE system_auth to <insert_sidecar_role> - Allows sidecar to read from roles and
#                                                                   role_permissions table
access_control:
  # When enabled requests need to be authenticated and authorized before servicing.
  enabled: false
  # Supports setting multiple authenticators, request is authenticated when the first authenticator allows the request
  # to go through.
  # Out of the box, Cassandra Sidecar provides following authenticator provider factories
  # org.apache.cassandra.sidecar.acl.authentication.{MutualTlsAuthenticationHandlerFactory, JwtAuthenticationHandlerFactory}.
  # - MutualTlsAuthenticationHandlerFactory  allows authenticating based on user certificates
  # - JwtAuthenticationHandlerFactory        allows authenticating with user JWT tokens
  authenticators:
    - class_name: org.apache.cassandra.sidecar.acl.authentication.MutualTlsAuthenticationHandlerFactory
      parameters:
        # Certificate validator is used to validate details within a certificate, such as issuer organization,
        # issuer country, CNs, certificate expiry etc.
        #
        # io.vertx.ext.auth.mtls.impl.AllowAllCertificateValidator performs no checks, it marks all certificates as valid.
        # other options are, io.vertx.ext.auth.mtls.impl.CertificateValidatorImpl
        certificate_validator: io.vertx.ext.auth.mtls.impl.AllowAllCertificateValidator
        # CertificateIdentityExtractor is used to extract valid identities from certificates. These identities will be
        # used for authorizing users.
        #
        # org.apache.cassandra.sidecar.acl.authentication.CassandraIdentityExtractor verifies that identity
        # extracted from certificate is present in identity_to_role table. Identities in identity_to_role table in
        # Cassandra are authenticated identities in Cassandra.
        #
        # other options are, io.vertx.ext.auth.mtls.impl.SpiffeIdentityExtractor.
        certificate_identity_extractor: org.apache.cassandra.sidecar.acl.authentication.CassandraIdentityExtractor
      # JwtAuthenticationHandlerFactory adds support to authenticate users with their JWT tokens. It also includes
      # supports for OpenID discovery.
    - class_name: org.apache.cassandra.sidecar.acl.authentication.JwtAuthenticationHandlerFactory
      parameters:
        # To selectively enable or disable JWT authentication
        enabled: false
        # Site for sidecar to dynamically retrieve the configuration information of an OpenID provider, without
        # having to manually configure settings like issuer etc.
        site: https://authorization.com
        # Client Id is a unique identifier assigned by OpenID provider. It is used to identity applications/users
        # trying to connect.
        client_id: recognized_client_id
        config_discover_interval: 1h
        #
        # Authentication type dictates whether to use the Oauth flow or a stateless JWT authenticator
        # If not provided, default is oauth. Valid values are oauth or stateless
        # jwt_auth_type: oauth
        #
        # Optional configurations for connecting to JWT PEM provider
        #
        # keystore_path defines the path to a keystore which can be used to provide SSL certificates to
        # a JWT pem provider. If specified, a password must be provided.
        # keystore_path: /path/to/keystore
        # keystore_password: changeme
        #
        # truststore_path defines the path to a truststore that contains the CA used to validate SSL certs used
        # by downstream PEM provider services. If specified, a password must be provided.
        # truststore_path: /path/to/truststore
        # truststore_password: changeme
        #
        # Optional JWT which can be used to authenticate to a downstream PEM provider if required.
        # pem_provider_jwt: changeme
  authorizer:
    # Authorization backend, implementing io.vertx.ext.auth.authorization.AuthorizationProvider; used to
    # provide permissions a user holds.
    # Out of the box, Cassandra Sidecar provides
    # org.apache.cassandra.sidecar.acl.authorization.{AllowAllAuthorizationProvider, RoleBasedAuthorizationProvider}.
    #
    # - AllowAllAuthorizationProvider  allows any action to any user - use it to disable authorization.
    # - RoleBasedAuthorizationProvider validates role associated with authenticated user has permission
    #                                  for resource it accesses.
    - class_name: org.apache.cassandra.sidecar.acl.authorization.AllowAllAuthorizationProvider
  # Identities that are authenticated and authorized.
  admin_identities:
#    - spiffe://authorized/admin/identities
  permission_cache:
    enabled: true
    # refresh_after_write does async cache refreshes. expire_after_access removes the cache entry on expiry. Prefer
    # setting refresh_after_write over expire_after_access for AuthCaches
    # expire_after_access: 5m
    refresh_after_write: 5m
    maximum_size: 1000
    warmup_retries: 5
    warmup_retry_interval: 2s

driver_parameters:
  contact_points:
    - "127.0.0.1:9042"
  auth_provider:
    class_name: org.apache.cassandra.sidecar.cluster.auth.ConfigProvider
    parameters:
      username: cassandra
      password: cassandra
  ssl:
    enabled:  false
    keystore:
      type: PKCS12
      path: path/to/keystore.p12
      password: password
    truststore:
      type: PKCS12
      path: path/to/keystore.p12
      password: password
  num_connections: 6
#  local_dc: datacenter1

healthcheck:
  initial_delay: 0ms
  execute_interval: 30s

# Cluster Topology Monitor settings
# Monitors Cassandra cluster topology changes and publishes events when detected
cluster_topology_monitor:
  enabled: true
  initial_delay: 0s
  execute_interval: 1000ms  # Interval between topology refresh cycles

# Sidecar Peer Health Monitor settings
# Enables a periodic task checking for the health of adjacent Sidecar peers in the token ring
sidecar_peer_health:
  # Determines if the peer health monitor periodic task is enabled or not
  enabled: false
  # Time between peer health checks
  execute_interval: 30s
  # The amount of retries the client will attempt a request
  max_retries: 5
  # The initial delay between the retries the client will attempt a request
  retry_delay: 10s

# Sidecar client settings used to interact with other sidecars
sidecar_client:
  request_timeout: 30s                      # Time in which a request made by the sidecar client will time out
  request_idle_timeout: 30s                 # How long the request can be idle

  # More advanced options to configure the sidecar client

  #connection_pool_max_size: 10              # Max size of the client connection pool
  #connection_pool_clearing_period: 5s       # Period of time for the connection pool to clear
  #connection_pool_event_loop_size: 0        # Defines the size of the event loop pool, set to 0 to reuse current event-loop
  #connection_pool_max_wait_queue_size: -1   # Connection pool max time to wait on the queue size, set to -1 for an unbounded queue
  #max_retries: 5                            # The amount of retries the client will attempt a request
  #retry_delay: 500ms                        # The initial delay between the retries the client will attempt a request
  #max_retry_delay: 10s                      # The max delay between the retries the client will attempt a request
  #ssl:                                      # if ssl is enabled, this is the ssl configuration used for the sidecar client
  #  enabled: false
  #  keystore:
  #    type: PKCS12                          # Keystore type
  #    path: path/to/client/keystore.p12     # Path to the client keystore file
  #    password: password                    # Keystore password
  #  truststore:
  #    type: PKCS12                          # Truststore type
  #    path: path/to/truststore.p12          # Path to the truststore file
  #    password: password                    # Truststore password

metrics:
  registry_name: cassandra_sidecar
  vertx:
    enabled: true
    expose_via_jmx: false
    jmx_domain_name: sidecar.vertx.jmx_domain
  include:                                    # empty include list means include all
    - type: "regex"                           # possible filter types are "regex" and "equals"
      value: "Sidecar.*"
    - type: "regex"
      value: "vertx.*"
  exclude:                                    # empty exclude list means exclude nothing
#    - type: "regex"                          # possible filter types are "regex" and "equals"
#      value: "vertx.eventbus.*"              # exclude all metrics starts with vertx.eventbus

cassandra_input_validation:
  validator:
    # Implementation to use for the validation of Casandra inputs. Out of the box, Cassandra Sidecar provides
    # org.apache.cassandra.sidecar.utils.{RegexBasedCassandraInputValidator, FastCassandraInputValidator}.
    #
    # - RegexBasedCassandraInputValidator default implementation the uses regular expressions to perform validations
    # - FastCassandraInputValidator optimized implementation that does not use regular expressions. This implementation
    #                               ignores the regular expressions configured in the cassandra_input_validation
    #                               configuration.
  - class_name: org.apache.cassandra.sidecar.utils.RegexBasedCassandraInputValidator
    # Configuration parameters that are only applicable to the FastCassandraInputValidator implementation
    #parameters:
    #  # Comma-separated list of terminations allowed for the component name. By default, allowed component
    #  # names can only end in .db, .cql, .json, .crc32, or TOC.txt
    #  valid_terminations: ".db,.cql,.json,.crc32,TOC.txt"
    #  # Comma-separated list of terminations allowed for the restricted component name. By default, allowed
    #  # restricted component names con only end in .db or TOC.txt
    #  valid_restricted_terminations: ".db,TOC.txt"
  forbidden_keyspaces:
    - system_schema
    - system_traces
    - system_distributed
    - system
    - system_auth
    - system_views
    - system_virtual_schema
    - sidecar_internal
  allowed_chars_for_directory: "[a-zA-Z][a-zA-Z0-9_]{0,47}"
  allowed_chars_for_quoted_name: "[a-zA-Z_0-9]{1,48}"
  allowed_chars_for_component_name: "[a-zA-Z0-9_-]+(\\.db|\\.cql|\\.json|\\.crc32|TOC\\.txt)"
  allowed_chars_for_restricted_component_name: "[a-zA-Z0-9_-]+(\\.db|TOC\\.txt)"
  # Pattern used to validate snapshot names. The default below matches the snapshot name
  # validation Cassandra adopted in CASSANDRA-21389, so that snapshots accepted by Sidecar
  # are also accepted by Cassandra.
  #
  # Prior to CASSANDRA-21389, Cassandra only rejected snapshot names containing the path
  # separator or a null character. To preserve that permissive behavior, set this pattern
  # to ".*" and use the RegexBasedCassandraInputValidator implementation; the
  # FastCassandraInputValidator ignores this setting and always enforces the
  # CASSANDRA-21389 rules.
  allowed_chars_for_snapshot_name: "[a-zA-Z0-9_.+-]{1,255}"

blob_restore:
  job_discovery_active_loop_delay: 5m
  job_discovery_idle_loop_delay: 10m
  job_discovery_status_check_interval: 1s
  job_discovery_recency_days: 5
  slice_process_max_concurrency: 20
  restore_job_tables_ttl: 90d
  slow_task_threshold: 10m
  slow_task_report_delay: 1m
  ring_topology_refresh_delay: 1m

s3_client:
  concurrency: 4
  thread_name_prefix: s3-client
  thread_keep_alive: 1m
  api_call_timeout: 1m # 1 minute
  range_get_object_bytes_size: 5242880  # 5 MiB
#  proxy_config:
#    uri:
#    username:
#    password:

live_migration:
  # By default, the directories handled by Cassandra like data_dir, commitlog_dir, hints_dir, saved_caches_dir,
  # cdc_dir, and local_system_data_file_dir are included as part of migration. Admin/operator can exclude files
  # and directories from migration by specifying them in the `files_to_exclude` list and the `dirs_to_exclude`
  # list configurations mentioned below.
  #
  # 'glob' and 'regex' patterns can be used to specify exclusions. Internally, Java's java.nio.file.PathMatcher
  # is used to evaluate these exclusions. Exclusions should be specified in the format "syntax:pattern" expected
  # by PathMatcher. There is no need to specify the absolute path of directories handled by Cassandra.
  # They can be specified using the supported placeholders listed below.
  #
  #    COMMITLOG_DIR              - commit log directory
  #    HINTS_DIR                  - hints directory
  #    SAVED_CACHES_DIR           - saved caches directory
  #    CDC_RAW_DIR                - cdc raw directory
  #    LOCAL_SYSTEM_DATA_FILE_DIR - local system data file data directory
  #    DATA_FILE_DIR              - all data directories
  #    DATA_FILE_DIR_0            - first data directory
  #    DATA_FILE_DIR_1            - second data directory
  #
  # A sample glob pattern to exclude all snapshot folders from Live Migration looks like this:
  #    glob:${DATA_FILE_DIR}/*/*/snapshots
  files_to_exclude: [ ]                   # List of files to exclude from Live Migration.
  dirs_to_exclude:
    - glob:${DATA_FILE_DIR}/*/*/snapshots # Excludes snapshot directories in data folder to copy to destination
  migration_map:                          # Map of source and destination Cassandra instances
#    localhost1: localhost4               # This entry says that localhost1 will be migrated to localhost4
  max_concurrent_file_requests: 20        # Maximum number of concurrent file requests allowed

# Configuration to allow sidecar start and stop Cassandra instances via the lifecycle API (disabled by default)
lifecycle:
  enabled: false
  provider:
    class_name: org.apache.cassandra.sidecar.lifecycle.ProcessLifecycleProvider
    parameters:
      state_dir: /var/lib/cassandra-sidecar/lifecycle # The directory where the process state is stored
      cassandra_home: /opt/cassandra # The default Cassandra installation directory
#     process_timeout_seconds: 120 # Timeout in seconds for Cassandra process start/stop operations (default: 120)
#     sys.cassandra.ring_delay_ms: 30000   # It is possible to set JVM properties via the "sys." prefix
#     env.MAX_HEAP_SIZE: 8G # It is possible to set environment variables used to start Cassandra via the "env" prefix
#     env.HEAP_NEWSIZE: 8G
