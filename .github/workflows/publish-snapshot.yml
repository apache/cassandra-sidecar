# Publishes a SNAPSHOT build to the ASF Nexus snapshot repository after every
# trunk commit that passes CI.
name: Publish Snapshot

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [trunk]
  workflow_dispatch:

# If several commits land in quick succession, cancel a stale in-progress
# publish in favor of the latest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish snapshot
    runs-on: ubuntu-latest
    # Only publish after a successful build of a push to trunk (never a PR, and
    # never a fork's CI run, which would otherwise have access to our secrets).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Java 11
        uses: actions/setup-java@v5
        with:
          java-version: "11"
          distribution: "temurin"
          cache: "gradle"

      - name: Restore dtest jars
        id: cache-dtest-jars
        uses: actions/cache/restore@v4
        with:
          path: |
            dtest-jars/
            cassandra-tarballs/
          key: dtest-jars-${{ hashFiles('scripts/build-dtest-jars.sh', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build dependencies (cache miss fallback)
        if: steps.cache-dtest-jars.outputs.cache-hit != 'true'
        run: |
          for i in {2..20}; do
            sudo ip addr add 127.0.0.$i/8 dev lo
            echo 127.0.0.${i} localhost${i} | sudo tee -a /etc/hosts
          done

          export CASSANDRA_USE_JDK11="true"
  
          ./scripts/build-dtest-jars.sh

      - name: Publish snapshot artifacts
        env:
          MAVEN_USERNAME: ${{ secrets.NEXUS_USER }}
          MAVEN_PASSWORD: ${{ secrets.NEXUS_PW }}
          CASSANDRA_DEP_DIR: ${{ github.workspace }}/dtest-jars
        run: ./scripts/publish-snapshot.sh
