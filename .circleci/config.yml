# Java Gradle CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-java/ for more details
#
version: 2.1

commands:
  install_common:
    steps:
      - run: sudo apt-get update
        # Somehow, the certs already installed in the java 11 image are installed strangely
        # in that there's a directory called `cacerts` with a symlink in it named `cacerts`
        # (/etc/ssl/certs/java/cacerts/cacerts) rather than just a symlink to
        # `cacerts` in the /etc/ssl/certs/java directory - if this is the case, fix it by
        # moving it down a directory and then ant should install cleanly
      - run: |
          if [ -f /etc/ssl/certs/java/cacerts/cacerts ]; then
              sudo mv /etc/ssl/certs/java/cacerts/ /etc/ssl/certs/java/cacerts-old
              sudo mv /etc/ssl/certs/java/cacerts-old/cacerts /etc/ssl/certs/java/
              sudo rmdir /etc/ssl/certs/java/cacerts-old
          fi
        # The image already has java installed, but `apt-get install ant` reinstalls it.
        # Therefore, we download just the deb package for ant and install it with dpkg.
      - run: |
          apt-get download ant ant-optional
          sudo dpkg --force-all -i ant*.deb
          rm ant*.deb
      # We need aliases for localhost2,localhost3, ..., localhost20 in hosts
      - run: |
          sudo bash -c 'for i in {2..20}; do echo 127.0.0.${i} localhost${i} >> /etc/hosts; done'
          cat /etc/hosts

  restore_gradle_cache:
    steps:
      - run:
          name: Compute Gradle cache key
          command: |
            { find . -type f \( -name 'build.gradle' -o -name 'settings.gradle' -o -name 'gradle.properties' \) -not -path '*/build/*' -not -path './.gradle/*' | sort | xargs sha256sum;
              sha256sum gradle/wrapper/gradle-wrapper.properties; } > .gradle-cache-key
            cat .gradle-cache-key
      - restore_cache:
          keys:
            - gradle-v1-{{ checksum ".gradle-cache-key" }}
            - gradle-v1-

  save_gradle_cache:
    steps:
      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: gradle-v1-{{ checksum ".gradle-cache-key" }}

jobs:
  # Runs java 8 tests on a docker image
  # We only produce client artifacts for java 8 builds
  client_only_unit_java8:
    docker:
      - image: cimg/openjdk:8.0
    steps:
      - install_common
      - setup_remote_docker
      - checkout
      - run: ./gradlew build --stacktrace

      - store_artifacts:
          path: build/reports
          destination: test-reports

      - store_artifacts:
          path: build/test-results/
          destination: test-results

      - store_test_results:
          path: build/test-results/

  # Runs java 11 tests on a docker image
  unit_java11:
    docker:
      - image: cimg/openjdk:11.0
    resource_class: large
    steps:
      - setup_remote_docker
      - install_common
      - checkout
      - restore_gradle_cache
      - attach_workspace:
          at: dtest-jars
      - run: ./gradlew build -x integrationTest --stacktrace
      - save_gradle_cache

      - store_artifacts:
          path: build/reports
          destination: test-reports

      - store_artifacts:
          path: build/test-results/
          destination: test-results

      - store_test_results:
          path: build/test-results/

  build-dtest-jdk11:
    docker:
      - image: cimg/openjdk:11.0
    resource_class: large
    steps:
      - install_common
      - checkout
      - run:
          name: Build jvm dtest jars with jdk11
          command: |
            scripts/build-dtest-jars.sh
      - persist_to_workspace:
          root: dtest-jars
          paths:
            - "*.jar"
      - persist_to_workspace:
          root: cassandra-tarballs
          paths:
            - "*.tar.gz"

  integration_cassandra_40_java11:
    docker:
      - image: cimg/openjdk:11.0
    environment:
      INTEGRATION_MAX_PARALLEL_FORKS: 2
      INTEGRATION_MAX_HEAP_SIZE: "2000M"
    resource_class: large
    steps:
      - install_common
      - checkout
      - restore_gradle_cache
      - attach_workspace:
          at: dtest-jars
      - run: ./scripts/install-shaded-dtest-jar-local.sh
      - run: ./gradlew --no-daemon --max-workers=2 -PdtestVersion=4.0.16 -Dcassandra.sidecar.versions_to_test="4.0" checkstyleIntegrationTest integrationTestLightWeight --stacktrace
      - save_gradle_cache

      - store_artifacts:
          path: build/reports
          destination: test-reports

      - store_artifacts:
          path: build/test-results/
          destination: test-results

      - store_test_results:
          path: build/test-results/

  integration_heavy_cassandra_40_java11:
    docker:
      - image: cimg/openjdk:11.0
    environment:
      INTEGRATION_MAX_PARALLEL_FORKS: 3
      INTEGRATION_MAX_HEAP_SIZE: "3600M"
    resource_class: large
    steps:
      - install_common
      - setup_remote_docker
      - checkout
      - restore_gradle_cache
      - attach_workspace:
          at: dtest-jars
      - attach_workspace:
          at: cassandra-tarballs
      - run: ./scripts/install-shaded-dtest-jar-local.sh
      - run: ./gradlew --no-daemon -PdtestVersion=4.0.16 -PtarballVersion=4.0 -Dcassandra.sidecar.versions_to_test="4.0" jar integrationTestHeavyWeight --stacktrace
      - save_gradle_cache

      - store_artifacts:
          path: build/reports
          destination: test-reports

      - store_artifacts:
          path: build/test-results/
          destination: test-results

      - store_test_results:
          path: build/test-results/

  integration_cassandra_50_java11:
    docker:
      - image: cimg/openjdk:11.0
    environment:
      INTEGRATION_MAX_PARALLEL_FORKS: 2
      INTEGRATION_MAX_HEAP_SIZE: "2000M"
    resource_class: large
    steps:
      - install_common
      - checkout
      - restore_gradle_cache
      - attach_workspace:
          at: dtest-jars
      - run: ./scripts/install-shaded-dtest-jar-local.sh
      - run: ./gradlew --no-daemon --max-workers=2 -PdtestVersion=5.0.3 -Dcassandra.sidecar.versions_to_test="5.0" checkstyleIntegrationTest integrationTestLightWeight --stacktrace
      - save_gradle_cache

      - store_artifacts:
          path: build/reports
          destination: test-reports

      - store_artifacts:
          path: build/test-results/
          destination: test-results

      - store_test_results:
          path: build/test-results/

  integration_heavy_cassandra_50_java11:
    docker:
      - image: cimg/openjdk:11.0
    environment:
      INTEGRATION_MAX_PARALLEL_FORKS: 3
      INTEGRATION_MAX_HEAP_SIZE: "3600M"
    resource_class: large
    steps:
      - install_common
      - setup_remote_docker
      - checkout
      - restore_gradle_cache
      - attach_workspace:
          at: dtest-jars
      - attach_workspace:
          at: cassandra-tarballs
      - run: ./scripts/install-shaded-dtest-jar-local.sh
      - run: ./gradlew --no-daemon -PdtestVersion=5.0.3 -PtarballVersion=5.0 -Dcassandra.sidecar.versions_to_test="5.0" jar integrationTestHeavyWeight --stacktrace
      - save_gradle_cache

      - store_artifacts:
          path: build/reports
          destination: test-reports

      - store_artifacts:
          path: build/test-results/
          destination: test-results

      - store_test_results:
          path: build/test-results/

  integration_cassandra_trunk_java11:
    docker:
      - image: cimg/openjdk:11.0
    environment:
      INTEGRATION_MAX_PARALLEL_FORKS: 2
      INTEGRATION_MAX_HEAP_SIZE: "2000M"
    resource_class: large
    steps:
      - install_common
      - checkout
      - restore_gradle_cache
      - attach_workspace:
          at: dtest-jars
      - run: ./scripts/install-shaded-dtest-jar-local.sh
      - run: ./gradlew --no-daemon --max-workers=2 -PdtestVersion=5.1 -Dcassandra.sidecar.versions_to_test="5.1" checkstyleIntegrationTest spotbugsIntegrationTest integrationTestLightWeight --stacktrace
      - save_gradle_cache

      - store_artifacts:
          path: build/reports
          destination: test-reports

      - store_artifacts:
          path: build/test-results/
          destination: test-results

      - store_test_results:
          path: build/test-results/

  integration_heavy_cassandra_trunk_java11:
    docker:
      - image: cimg/openjdk:11.0
    environment:
      INTEGRATION_MAX_PARALLEL_FORKS: 3
      INTEGRATION_MAX_HEAP_SIZE: "3600M"
    resource_class: large
    steps:
      - install_common
      - setup_remote_docker
      - checkout
      - restore_gradle_cache
      - attach_workspace:
          at: dtest-jars
      - attach_workspace:
          at: cassandra-tarballs
      - run: ./scripts/install-shaded-dtest-jar-local.sh
      - run: ./gradlew --no-daemon -PdtestVersion=5.1 -PtarballVersion=5.1 -Dcassandra.sidecar.versions_to_test="5.1" jar integrationTestHeavyWeight --stacktrace
      - save_gradle_cache

      - store_artifacts:
          path: build/reports
          destination: test-reports

      - store_artifacts:
          path: build/test-results/
          destination: test-results

      - store_test_results:
          path: build/test-results/

  # ensures we can build and install deb packages
  deb_build_install:
    docker:
      - image: cimg/openjdk:11.0
    steps:
      - install_common
      - checkout
      - restore_gradle_cache
      - run: sudo apt --fix-broken install
      - run:
          name: Build DEB
          command: |
            ./gradlew --parallel clean buildDeb \
              -x test -x integrationTest \
              -x rat \
              -x checkstyleMain -x checkstyleTest -x checkstyleTestFixtures \
              -x spotbugsMain -x spotbugsTest \
              -x javadoc \
              -x asciidoctor -x copyDocs
      - run: DEBIAN_FRONTEND=noninteractive sudo apt install -y ./build/distributions/apache-cassandra-sidecar*.deb
      - run: test -f /opt/apache-cassandra-sidecar/bin/cassandra-sidecar
      - run: test -f /opt/apache-cassandra-sidecar/conf/sidecar.yaml
      - run: test -f /opt/apache-cassandra-sidecar/conf/logback.xml
      - run: test -f /opt/apache-cassandra-sidecar/LICENSE.txt
      - run: test -f /opt/apache-cassandra-sidecar/lib/cassandra-sidecar-*.jar
      - run:
          name: Verify DEB package version
          command: |
            EXPECTED_UPSTREAM=$(grep "^version=" gradle.properties | cut -d'=' -f2 | tr '-' '~')
            ACTUAL_VERSION=$(dpkg-query -W -f='${Version}' apache-cassandra-sidecar)
            ACTUAL_UPSTREAM="${ACTUAL_VERSION%-*}"
            ACTUAL_REVISION="${ACTUAL_VERSION##*-}"
            echo "DEB: upstream=${ACTUAL_UPSTREAM}, revision=${ACTUAL_REVISION}, expected upstream=${EXPECTED_UPSTREAM}"
            if [ -z "${ACTUAL_REVISION}" ] || [ "${ACTUAL_REVISION}" = "${ACTUAL_VERSION}" ]; then
              echo "DEB has no Debian revision — yields trailing '-' style bug"
              exit 1
            fi
            if [ "${ACTUAL_UPSTREAM}" != "${EXPECTED_UPSTREAM}" ]; then
              echo "DEB upstream version mismatch: expected '${EXPECTED_UPSTREAM}', got '${ACTUAL_UPSTREAM}'"
              exit 1
            fi

  # ensures we can build and install rpm packages
  rpm_build_install:
    docker:
      - image: cimg/openjdk:11.0
    steps:
      - run: sudo apt-get update && sudo apt-get install -y dnf rpm
      - checkout
      - restore_gradle_cache
      - run:
          name: Build RPM
          command: |
            ./gradlew --parallel buildRpm \
              -x test -x integrationTest \
              -x rat \
              -x checkstyleMain -x checkstyleTest -x checkstyleTestFixtures \
              -x spotbugsMain -x spotbugsTest \
              -x javadoc \
              -x asciidoctor -x copyDocs
      - run: sudo dnf install -y ./build/distributions/apache-cassandra-sidecar*.rpm
      - run: test -f /opt/apache-cassandra-sidecar/bin/cassandra-sidecar
      - run: test -f /opt/apache-cassandra-sidecar/conf/sidecar.yaml
      - run: test -f /opt/apache-cassandra-sidecar/conf/logback.xml
      - run: test -f /opt/apache-cassandra-sidecar/LICENSE.txt
      - run: test -f /opt/apache-cassandra-sidecar/lib/cassandra-sidecar-*.jar
      - run:
          name: Verify RPM package version
          command: |
            EXPECTED_VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2 | tr '-' '~')
            RPM_FILE=$(ls build/distributions/apache-cassandra-sidecar*.rpm | head -n1)
            ACTUAL_VERSION=$(rpm -qp --queryformat '%{VERSION}' "${RPM_FILE}")
            ACTUAL_RELEASE=$(rpm -qp --queryformat '%{RELEASE}' "${RPM_FILE}")
            echo "RPM: version=${ACTUAL_VERSION}, release=${ACTUAL_RELEASE}, expected=${EXPECTED_VERSION}"
            if [ -z "${ACTUAL_RELEASE}" ] || [ "${ACTUAL_RELEASE}" = "(none)" ]; then
              echo "RPM Release is empty — yields trailing '-' in 'yum list'"
              exit 1
            fi
            if [ "${ACTUAL_VERSION}" != "${EXPECTED_VERSION}" ]; then
              echo "RPM Version mismatch: expected '${EXPECTED_VERSION}', got '${ACTUAL_VERSION}'"
              exit 1
            fi

  docker_build:
    docker:
      - image: cimg/openjdk:11.0
    steps:
      - setup_remote_docker
      - checkout
      - run: ./gradlew --info clean :server:jibDockerBuild

  docs_build:
    docker:
      - image: cimg/openjdk:11.0
    steps:
      - install_common
      - checkout
      - run: ./gradlew docs:asciidoctor
      - run: test -f docs/build/user.html
      - run: test -f docs/build/development.html

workflows:
  version: 2
  build-and-test:
    jobs:
      - approve-build:
          type: approval
      - build-dtest-jdk11:
          requires:
            - approve-build
      - client_only_unit_java8:
          requires:
            - approve-build
      - unit_java11:
          requires:
            - build-dtest-jdk11
      - integration_cassandra_40_java11:
          requires:
            - unit_java11
            - build-dtest-jdk11
      - integration_cassandra_50_java11:
          requires:
            - unit_java11
            - build-dtest-jdk11
      - integration_cassandra_trunk_java11:
          requires:
            - unit_java11
            - build-dtest-jdk11
      - integration_heavy_cassandra_40_java11:
          requires:
            - unit_java11
            - build-dtest-jdk11
      - integration_heavy_cassandra_50_java11:
          requires:
            - unit_java11
            - build-dtest-jdk11
      - integration_heavy_cassandra_trunk_java11:
          requires:
            - unit_java11
            - build-dtest-jdk11
      - docs_build:
          requires:
            - client_only_unit_java8
            - unit_java11
            - integration_cassandra_40_java11
            - integration_heavy_cassandra_40_java11
            - integration_cassandra_50_java11
            - integration_heavy_cassandra_50_java11
            - integration_cassandra_trunk_java11
            - integration_heavy_cassandra_trunk_java11
      - docker_build:
          requires:
            - client_only_unit_java8
            - unit_java11
            - integration_cassandra_40_java11
            - integration_heavy_cassandra_40_java11
            - integration_cassandra_50_java11
            - integration_heavy_cassandra_50_java11
            - integration_cassandra_trunk_java11
            - integration_heavy_cassandra_trunk_java11
      - rpm_build_install:
          requires:
            - client_only_unit_java8
            - unit_java11
            - integration_cassandra_40_java11
            - integration_heavy_cassandra_40_java11
            - integration_cassandra_50_java11
            - integration_heavy_cassandra_50_java11
            - integration_cassandra_trunk_java11
            - integration_heavy_cassandra_trunk_java11
      - deb_build_install:
          requires:
            - client_only_unit_java8
            - unit_java11
            - integration_cassandra_40_java11
            - integration_heavy_cassandra_40_java11
            - integration_cassandra_50_java11
            - integration_heavy_cassandra_50_java11
            - integration_cassandra_trunk_java11
            - integration_heavy_cassandra_trunk_java11
