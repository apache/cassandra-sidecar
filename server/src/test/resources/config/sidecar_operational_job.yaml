#
# Cassandra Sidecar operational job configuration file.
#
cassandra:
  host: localhost
  port: 9042
  storage_dir: /ccm/test/node1
  staging_dir: /ccm/test/node1/sstable-staging
  jmx_host: 127.0.0.1
  jmx_port: 7199

sidecar:
  host: 0.0.0.0
  port: 0
  request_idle_timeout: 5m
  request_timeout: 5m

operational_job:
  tables_ttl: 30d
  coordination_enabled: false
  local_job_coordination_delay: 90s
  node_execution_timeout: 20m
  durable_tracking_enabled: true
