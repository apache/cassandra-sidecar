allprojects { prj ->
    plugins.withType(JavaPlugin) {
        prj.apply plugin: 'com.diffplug.spotless'

        spotless {
            java {


                eclipse().configFile "${rootDir}/gradle/validation/cassandra-sidecar-cs-formatter.xml"

                importOrder 'java', 'javax', 'com.google.common', 'org.apache.commons', 'org.junit', 'org.slf4j', '', '\\#org.junit','\\#'
                removeUnusedImports()

                trimTrailingWhitespace()

                endWithNewline()
                indentWithSpaces(4)

                // 3) simple whitespace fixe




                // Apply to all Java sources
//                target "src/**/*.java"
            }
        }

        // Workaround for an odd problem in spotless where it fails because
        // of a missing folder.
        spotlessJava {
            doFirst {
                project.mkdir("${buildDir}/spotless/spotlessJava")
            }
        }
    }

    tasks.matching { task -> task.name == "spotlessCheck" }.configureEach { v ->
        check.dependsOn v
    }
}